<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/favicon.png" type="image/x-icon">
  <title>Factory Game</title>
</head>

<body>
  <div id="game"></div>
  <div class="top-right ui">
      <input type="radio" id="play" checked name="player" class="ui-button" autocomplete="off">
      <input type="radio" id="pause" name="player" class="ui-button" autocomplete="off">
      <input type="radio" id="fast-forward" name="player" class="ui-button" autocomplete="off">
  </div>
  <div id="overlay" hidden>
  </div>
  <div id="buildMenu" class="right" hidden>
    <div id="buildingMenuTemplate" class="buildMenuItem" hidden>
      <span class="buildingImage"></span>
      <span class="buildingName">Harvester</span>
      <span class="buildingDesc">Plant, wait, harvest, repeat</span>
    </div>
    <div id="cancelButton">Cancel</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
